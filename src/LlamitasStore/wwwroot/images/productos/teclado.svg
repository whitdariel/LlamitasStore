<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Teclado">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#352a52"/><stop offset="1" stop-color="#1a1628"/></linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7557ce"/><stop offset=".5" stop-color="#86d6ef"/><stop offset="1" stop-color="#e96f5e"/></linearGradient>
    <pattern id="teclas" width="24" height="24" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="20" height="20" rx="4" fill="#4a4166" stroke="#5c537d"/></pattern>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
