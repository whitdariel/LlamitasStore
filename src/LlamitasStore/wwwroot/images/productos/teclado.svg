    <rect x="52" y="102" width="296" height="96" fill="url(#teclas)"/>
    <rect x="124" y="198" width="140" height="18" rx="4" fill="#4a4166" stroke="#5c537d"/>
    <rect x="52" y="102" width="20" height="20" rx="4" fill="#e96f5e"/>
  </g>
</svg>
